services:
  greenmail-manager-node:
    image: node:20-bookworm
    container_name: greenmail-manager-node
    working_dir: /workspace
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${TCP_PORT_PUBLIC:-3888}:3888"
    volumes:
      - .:/workspace
      - greenmail-node-root-modules:/workspace/node_modules
      - greenmail-node-client-modules:/workspace/client/node_modules
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      NODE_ENV: production
      PORT: 3000
      TCP_PORT: 3888
      DATA_DIR: /workspace/data
    command: >
      sh -lc "
      npm install &&
      cd client &&
      npm install --include=dev &&
      npm run build &&
      cd .. &&
      node server/index.js
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  greenmail-node-root-modules:
  greenmail-node-client-modules:
